services:
  db:
    image: postgres:alpine
    container_name: cosmolost-postgres
    restart: always
    env_file:
        - ./../backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-cosmolost}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cosmolost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cosmolost-network

  redis:
    image: redis:7-alpine
    container_name: cosmolost-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - cosmolost-network
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: ./../backend
    container_name: cosmolost-backend
    image: cosmolost-backend:latest
    restart: always
    env_file:
        - ./../backend/.env
    command: sh -c "uv run manage.py migrate && uv run manage.py run_ingest && uv run manage.py runserver 0.0.0.0:8000"
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cosmolost-network

  ingest-worker:
    build: ./../backend
    container_name: django_ingest_worker
    restart: always
    env_file:
        - ./../backend/.env
    command: uv run manage.py run_ingest --daemon --interval 3600
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cosmolost-network

  mcp-service:
    container_name: cosmolost-mcp-service
    image: cosmolost-backend:latest
    restart: unless-stopped
    env_file:
      - ./../backend/.env
    command: uv run mcp/server.py --transport sse --port 8001 --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - cosmolost-network

  web-client:
    build: ./../web-client
    container_name: cosmolost-web-client
    restart: always
    depends_on:
      - backend
    networks:
      - cosmolost-network

  gateway:
    build: ./gateway
    container_name: cosmolost-gateway
    restart: always
    ports:
      - "9088:80"
    depends_on:
      - web-client
      - backend
    networks:
      - cosmolost-network

volumes:
  postgres_data:
  redis_data:

networks:
  cosmolost-network:
    driver: bridge
