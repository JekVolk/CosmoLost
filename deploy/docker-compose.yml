services:
  db:
    image: postgres:alpine
    container_name: postgres_db
    restart: always
    env_file:
        - ./../backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-cosmolost}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cosmolost-network

  backend:
    build: ./../backend
    container_name: django_backend
    restart: always
    env_file:
        - ./../backend/.env
    command: sh -c "uv run manage.py migrate && uv run manage.py runserver 0.0.0.0:8000"
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - cosmolost-network

  frontend:
    build: ./../web-client
    container_name: vite_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - cosmolost-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "9088:80"
    volumes:
      - ./nginx-reverse.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - cosmolost-network

volumes:
  postgres_data:

networks:
  cosmolost-network:
    driver: bridge
