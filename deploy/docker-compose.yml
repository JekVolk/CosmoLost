services:
  db:
    image: postgres:alpine
    container_name: postgres_db
    restart: always
    env_file:
        - ./../backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-cosmolost}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cosmolost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cosmolost-network

  backend:
    build: ./../backend
    container_name: django_backend
    restart: always
    env_file:
        - ./../backend/.env
    command: sh -c "uv run manage.py migrate && uv run manage.py run_ingest && uv run manage.py runserver 0.0.0.0:8000"
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cosmolost-network

  ingest-worker:
    build: ./../backend
    container_name: django_ingest_worker
    restart: always
    env_file:
        - ./../backend/.env
    command: uv run manage.py run_ingest --daemon --interval 3600
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      - db
    networks:
      - cosmolost-network

  frontend:
    build: ./../web-client
    container_name: vite_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - cosmolost-network

  nginx:
    build: ./proxy
    container_name: nginx_proxy
    restart: always
    ports:
      - "9088:80"
    depends_on:
      - frontend
      - backend
    networks:
      - cosmolost-network

volumes:
  postgres_data:

networks:
  cosmolost-network:
    driver: bridge
